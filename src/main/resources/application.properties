spring.application.name=campusfind
server.port=8080

# ---- MySQL (XAMPP default: user root, empty password, port 3306) ----
# createDatabaseIfNotExist=true -> the "campusfind" database is created automatically
spring.datasource.url=jdbc:mysql://localhost:3306/campusfind?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# ---- JPA / Hibernate: tables are created/updated automatically from the entities ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---- App settings ----
# Needed to register an ADMIN account through /api/auth/register
campusfind.admin-code=CAMPUS2026

